<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galaxia 3D y Torta Hiperrealista de Cumpleaños</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            overflow: hidden;
            background-color: #010105;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            user-select: none;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        
        /* Modal para visualizar las fotos con tarjeta Glassmorphism */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(1, 1, 5, 0.88);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s ease;
            backdrop-filter: blur(12px);
        }
        .modal.active {
            display: flex;
            opacity: 1;
        }
        .modal-content {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 215, 0, 0.3);
            padding: 24px;
            border-radius: 20px;
            max-width: 460px;
            width: 90%;
            text-align: center;
            color: #fff;
            box-shadow: 0 0 50px rgba(212, 175, 55, 0.35);
            transform: scale(0.8);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }
        .modal.active .modal-content {
            transform: scale(1);
        }
        .modal img {
            width: 100%;
            height: auto;
            max-height: 350px;
            object-fit: contain;
            border-radius: 12px;
            margin-bottom: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.7);
        }
        .modal h2 {
            font-size: 1.6rem;
            margin-bottom: 10px;
            color: #ffd700;
            font-weight: 600;
            text-shadow: 0 0 12px rgba(255, 215, 0, 0.6);
        }
        .modal p {
            font-size: 0.98rem;
            line-height: 1.5;
            color: #e0e0e0;
        }
        .close-btn {
            position: absolute;
            top: 12px;
            right: 18px;
            font-size: 28px;
            color: #aaa;
            cursor: pointer;
            transition: color 0.2s;
        }
        .close-btn:hover {
            color: #ffd700;
        }

        /* Panel UI superior con solo Feliz Cumpleaños */
        .info-panel {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #ffffff;
            text-align: center;
            pointer-events: none;
            background: rgba(8, 8, 18, 0.7);
            padding: 12px 28px;
            border-radius: 30px;
            border: 1px solid rgba(255, 215, 0, 0.3);
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 25px rgba(0,0,0,0.5);
        }
        .info-panel h1 {
            font-size: 1.35rem;
            letter-spacing: 1px;
            margin-bottom: 0;
            background: linear-gradient(45deg, #ffd700, #ff6b81, #70a1ff);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
    <!-- Imports de Three.js y OrbitControls desde CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <div class="info-panel">
        <h1>✨ Feliz Cumpleaños ✨</h1>
    </div>

    <!-- Modal interactivo -->
    <div class="modal" id="imageModal">
        <div class="modal-content">
            <span class="close-btn" id="closeModal">&times;</span>
            <img id="modalImg" src="" alt="Foto de Cumpleaños">
            <h2 id="modalTitle">Título</h2>
            <p id="modalText">Texto descriptivo...</p>
        </div>
    </div>

    <script>
        // =========================================================================
        //  CONFIGURACIÓN EDITABLE DE IMÁGENES Y TEXTOS
        // =========================================================================
        const CONFIG_FOTOS = [
            {
                url: 'aironman.jpg',
                titulo: 'Iron Man',
                texto: 'Como Iron Man, demuestras que no se necesita un superpoder para marcar la diferencia y ser un heroe. ¡Que este año te traiga la fuerza y la inspiración para alcanzar todas tus metas!',
            },
            {
                url: 'capitan.jpg',
                titulo:'Capitán América',
                texto:'Como Capitán América, nunca pierdas la fe en las buenas personas y siempre luchas por lo correcto. ¡Que este año te recompense con todo el éxito y la felicidad que te mereces!',
            },
            {
                url: 'thor.jpg',
                titulo: 'Thor',
                texto: 'Al igual que Thor, tu nobleza y tu gran corazón demuestran que eres totalmente digna de brillar. ¡Sigue levantando tu propio Mjonir para conquistar cada meta que te propongas!'
            },
            {
                url: 'hulk.jpg',
                titulo: 'Hulk',
                texto: 'Como Hulk en el equipo, se que si las cosas se ponen feas, tú eres mi mejor defensa.¡ Que tranquilidad da saber que estas de mi lado para aplastar cualquier mal día!'
            },
            {
                url: 'batman.jpg',
                titulo: 'Batman',
                texto: 'Al igual que Batman, cuidas de quienes quieres con lealtad incondicional que protege en todo momento. ¡Gracias por ser ese refugio que siempre vela por mi felicidad!'
            },
            {
                url: 'superman.jpg',
                titulo: 'Superman',
                texto: 'Como Superman, te conviertes en mi escudo y fuerza cuando el día se pone complicado. ¡Gracias por hacerme sentir que a tu lado nada malo me puede pasar!'
            },
            {
                url: 'hombrearana.jpg',
                titulo: 'Hombre Araña',
                texto: 'Al mismo estilo del Hombre Araña, no importa cuantas veces tropieces, siemmpre te levantas más fuerte y valiente. ¡Feliz Cumpleaños!'
            }
        ];

        // =========================================================================
        //  ESCENA PRINCIPAL, CÁMARA Y RENDERIZADOR
        // =========================================================================
        const container = document.getElementById('canvas-container');
        
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x010105, 0.01);

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 10, 30);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        // Controles de cámara
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxDistance = 70;
        controls.minDistance = 5;
        controls.maxPolarAngle = Math.PI / 2 + 0.1;

        // =========================================================================
        //  ILUMINACIÓN REALISTA
        // =========================================================================
        const ambientLight = new THREE.AmbientLight(0xfff5ea, 0.85);
        scene.add(ambientLight);

        // Luz principal cálida con sombras suaves
        const sunLight = new THREE.DirectionalLight(0xfffaed, 1.4);
        sunLight.position.set(12, 22, 14);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        sunLight.shadow.bias = -0.0001;
        scene.add(sunLight);

        // Luz secundaria azulada de relleno estilo estudio
        const rimLight = new THREE.DirectionalLight(0x70a1ff, 0.6);
        rimLight.position.set(-14, 12, -12);
        scene.add(rimLight);

        // Luz de llama de vela
        const candleLight = new THREE.PointLight(0xffaa00, 3.0, 20);
        candleLight.position.set(0, 5.8, 0);
        candleLight.castShadow = true;
        scene.add(candleLight);

        // =========================================================================
        //  TEXTURAS PROCEDURALES Y CANVAS PARA PLACA "CHOCLIS"
        // =========================================================================
        function createNoiseTexture(colorHex1, colorHex2, size = 512) {
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = colorHex1;
            ctx.fillRect(0, 0, size, size);

            for (let i = 0; i < 40000; i++) {
                const x = Math.random() * size;
                const y = Math.random() * size;
                const alpha = Math.random() * 0.08;
                ctx.fillStyle = colorHex2;
                ctx.globalAlpha = alpha;
                ctx.fillRect(x, y, 2, 2);
            }

            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            texture.repeat.set(2, 2);
            return texture;
        }

        const creamTexture = createNoiseTexture('#fffbf5', '#e6dace');
        const chocolateTexture = createNoiseTexture('#3b1a08', '#200c03');

        // Generar textura para la placa de chocolate con la palabra "Choclis"
        function createChoclisTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');

            // Fondo de la placa de chocolate
            ctx.fillStyle = '#2b1305';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Borde dorado
            ctx.strokeStyle = '#d4af37';
            ctx.lineWidth = 12;
            ctx.strokeRect(12, 12, canvas.width - 24, canvas.height - 24);

            // Texto "Choclis" en dorado brillante
            ctx.fillStyle = '#ffd700';
            ctx.font = 'bold 85px "Segoe UI", cursive, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.shadowColor = 'rgba(0, 0, 0, 0.8)';
            ctx.shadowBlur = 10;
            ctx.fillText('Choclis', canvas.width / 2, canvas.height / 2);

            return new THREE.CanvasTexture(canvas);
        }

        const choclisTexture = createChoclisTexture();

        // =========================================================================
        //  GALAXIA ESPIRAL DENSA Y MULTICOLOR
        // =========================================================================
        const galaxyGroup = new THREE.Group();
        scene.add(galaxyGroup);

        const particleCount = 32000;
        const positions = new Float32Array(particleCount * 3);
        const colors = new Float32Array(particleCount * 3);

        const colorGold = new THREE.Color(0xffd700);
        const colorMagenta = new THREE.Color(0xff007f);
        const colorCyan = new THREE.Color(0x00f0ff);

        for (let i = 0; i < particleCount; i++) {
            const i3 = i * 3;
            const radius = Math.pow(Math.random(), 2) * 36 + 2;
            const spinAngle = radius * 0.65;
            const branchAngle = ((i % 5) * Math.PI * 2) / 5;

            const spreadX = (Math.random() - 0.5) * (radius * 0.22);
            const spreadY = (Math.random() - 0.5) * (radius * 0.12);
            const spreadZ = (Math.random() - 0.5) * (radius * 0.22);

            positions[i3] = Math.cos(branchAngle + spinAngle) * radius + spreadX;
            positions[i3 + 1] = spreadY - 0.5;
            positions[i3 + 2] = Math.sin(branchAngle + spinAngle) * radius + spreadZ;

            const mixedColor = colorGold.clone();
            if (radius < 10) {
                mixedColor.lerp(colorMagenta, radius / 10);
            } else {
                mixedColor.lerp(colorMagenta, 1).lerp(colorCyan, (radius - 10) / 26);
            }

            colors[i3] = mixedColor.r;
            colors[i3 + 1] = mixedColor.g;
            colors[i3 + 2] = mixedColor.b;
        }

        const galaxyGeometry = new THREE.BufferGeometry();
        galaxyGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        galaxyGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        const galaxyMaterial = new THREE.PointsMaterial({
            size: 0.15,
            sizeAttenuation: true,
            depthWrite: false,
            blending: THREE.AdditiveBlending,
            vertexColors: true,
            transparent: true,
            opacity: 0.85
        });

        const galaxyParticles = new THREE.Points(galaxyGeometry, galaxyMaterial);
        galaxyGroup.add(galaxyParticles);

        // =========================================================================
        //  MODELO DE TORTA GOURMET MULTINIVEL HIPERREALISTA
        // =========================================================================
        const cakeGroup = new THREE.Group();
        scene.add(cakeGroup);

        // Materiales Físicos Realistas (PBR)
        const plateMat = new THREE.MeshStandardMaterial({
            color: 0xffffff,
            roughness: 0.1,
            metalness: 0.9,
            envMapIntensity: 1.0
        });

        const goldRingMat = new THREE.MeshStandardMaterial({
            color: 0xd4af37,
            roughness: 0.25,
            metalness: 0.85
        });

        const vanillaCreamMat = new THREE.MeshStandardMaterial({
            color: 0xfffaf2,
            map: creamTexture,
            roughness: 0.55,
            metalness: 0.02
        });

        const strawberryCreamMat = new THREE.MeshStandardMaterial({
            color: 0xff758f,
            roughness: 0.4,
            metalness: 0.05
        });

        const ganacheChocolateMat = new THREE.MeshStandardMaterial({
            color: 0x2b1305,
            map: chocolateTexture,
            roughness: 0.18,
            metalness: 0.1
        });

        const plaqueChoclisMat = new THREE.MeshStandardMaterial({
            map: choclisTexture,
            roughness: 0.2,
            metalness: 0.1
        });

        const freshStrawberryMat = new THREE.MeshStandardMaterial({
            color: 0xd63031,
            roughness: 0.15,
            metalness: 0.05
        });

        const mintLeafMat = new THREE.MeshStandardMaterial({
            color: 0x10ac84,
            roughness: 0.4
        });

        const candleWaxMat = new THREE.MeshStandardMaterial({
            color: 0xffffff,
            roughness: 0.25
        });

        const flameMat = new THREE.MeshBasicMaterial({ color: 0xffbe76 });

        // 1. Bandeja Elegante
        const plateBase = new THREE.Mesh(new THREE.CylinderGeometry(5.8, 5.6, 0.2, 64), plateMat);
        plateBase.position.y = 0.1;
        plateBase.receiveShadow = true;
        cakeGroup.add(plateBase);

        const plateGoldBorder = new THREE.Mesh(new THREE.TorusGeometry(5.7, 0.08, 16, 64), goldRingMat);
        plateGoldBorder.rotation.x = Math.PI / 2;
        plateGoldBorder.position.y = 0.2;
        cakeGroup.add(plateGoldBorder);

        // Construir pisos de la torta
        function buildCakeTier(radius, height, posY, mainMaterial) {
            const group = new THREE.Group();

            const body = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, height, 64), mainMaterial);
            body.position.y = posY + height / 2;
            body.castShadow = true;
            body.receiveShadow = true;
            group.add(body);

            const rosettesCount = Math.floor(radius * 10);
            for (let i = 0; i < rosettesCount; i++) {
                const angle = (i / rosettesCount) * Math.PI * 2;
                
                const rosetteTop = new THREE.Mesh(new THREE.DodecahedronGeometry(0.14, 1), vanillaCreamMat);
                rosetteTop.scale.set(1, 1.4, 1);
                rosetteTop.position.set(Math.cos(angle) * (radius - 0.05), posY + height, Math.sin(angle) * (radius - 0.05));
                group.add(rosetteTop);

                const rosetteBottom = new THREE.Mesh(new THREE.DodecahedronGeometry(0.16, 1), vanillaCreamMat);
                rosetteBottom.scale.set(1.2, 0.9, 1.2);
                rosetteBottom.position.set(Math.cos(angle) * radius, posY + 0.1, Math.sin(angle) * radius);
                group.add(rosetteBottom);
            }

            return group;
        }

        // Piso 1
        const tier1 = buildCakeTier(4.6, 2.2, 0.2, vanillaCreamMat);
        cakeGroup.add(tier1);

        // Piso 2
        const tier2 = buildCakeTier(3.3, 1.8, 2.4, strawberryCreamMat);
        cakeGroup.add(tier2);

        // Piso 3
        const tier3 = buildCakeTier(2.1, 1.4, 4.2, ganacheChocolateMat);
        cakeGroup.add(tier3);

        // Drip de chocolate
        const dripCount = 20;
        for (let i = 0; i < dripCount; i++) {
            const angle = (i / dripCount) * Math.PI * 2;
            const dripLength = 0.3 + Math.random() * 0.6;
            const drip = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.02, dripLength, 12), ganacheChocolateMat);
            drip.position.set(Math.cos(angle) * 3.32, 4.2 - dripLength / 2, Math.sin(angle) * 3.32);
            cakeGroup.add(drip);
        }

        // 2. Fresas y Hojas
        const strawberryCount = 8;
        for (let i = 0; i < strawberryCount; i++) {
            const angle = (i / strawberryCount) * Math.PI * 2;
            const strawGroup = new THREE.Group();

            const berry = new THREE.Mesh(new THREE.ConeGeometry(0.26, 0.48, 16), freshStrawberryMat);
            berry.rotation.x = Math.PI;
            berry.position.y = 0.24;
            berry.castShadow = true;
            strawGroup.add(berry);

            for (let l = 0; l < 4; l++) {
                const leaf = new THREE.Mesh(new THREE.PlaneGeometry(0.18, 0.18), mintLeafMat);
                leaf.rotation.x = -Math.PI / 2;
                leaf.rotation.z = (l * Math.PI) / 2;
                leaf.position.y = 0.48;
                strawGroup.add(leaf);
            }

            strawGroup.position.set(Math.cos(angle) * 1.4, 5.6, Math.sin(angle) * 1.4);
            cakeGroup.add(strawGroup);
        }

        // 3. Velas
        const candlePositions = [
            [0, 5.6, 0],
            [0.7, 5.6, 0.7],
            [-0.7, 5.6, -0.7],
            [0.7, 5.6, -0.7],
            [-0.7, 5.6, 0.7]
        ];

        const animatedFlames = [];

        candlePositions.forEach((pos, idx) => {
            const candle = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, 1.2, 16), candleWaxMat);
            candle.position.set(pos[0], pos[1] + 0.6, pos[2]);
            candle.castShadow = true;
            cakeGroup.add(candle);

            const wick = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, 0.14, 8), ganacheChocolateMat);
            wick.position.set(pos[0], pos[1] + 1.25, pos[2]);
            cakeGroup.add(wick);

            const flame = new THREE.Mesh(new THREE.ConeGeometry(0.11, 0.38, 12), flameMat);
            flame.position.set(pos[0], pos[1] + 1.44, pos[2]);
            cakeGroup.add(flame);

            animatedFlames.push({
                mesh: flame,
                baseY: pos[1] + 1.44,
                seed: idx * 2.0
            });
        });

        // Placa de Chocolate que dice "Choclis"
        const plaqueGeo = new THREE.BoxGeometry(2.6, 1.2, 0.08);
        const plaqueMaterials = [
            ganacheChocolateMat, // lateral derecho
            ganacheChocolateMat, // lateral izquierdo
            ganacheChocolateMat, // superior
            ganacheChocolateMat, // inferior
            plaqueChoclisMat,    // frontal (Texto Choclis)
            ganacheChocolateMat  // posterior
        ];
        const plaque = new THREE.Mesh(plaqueGeo, plaqueMaterials);
        plaque.position.set(0, 3.3, 3.4);
        plaque.rotation.x = -0.15;
        cakeGroup.add(plaque);

        // =========================================================================
        //  FOTOS FLOTANTES CON MARCOS ELEGANTES
        // =========================================================================
        const photoMeshes = [];
        const textureLoader = new THREE.TextureLoader();

        CONFIG_FOTOS.forEach((data, index) => {
            const angle = (index / CONFIG_FOTOS.length) * Math.PI * 2;
            const dist = 13.5;

            textureLoader.load(data.url, (texture) => {
                const photoGroup = new THREE.Group();

                const imgMesh = new THREE.Mesh(
                    new THREE.PlaneGeometry(3.5, 3.5),
                    new THREE.MeshBasicMaterial({ map: texture, side: THREE.DoubleSide })
                );
                photoGroup.add(imgMesh);

                const frameMesh = new THREE.Mesh(
                    new THREE.BoxGeometry(3.7, 3.7, 0.08),
                    goldRingMat
                );
                frameMesh.position.z = -0.05;
                photoGroup.add(frameMesh);

                photoGroup.position.x = Math.cos(angle) * dist;
                photoGroup.position.z = Math.sin(angle) * dist;
                photoGroup.position.y = 2 + Math.sin(index * 2) * 1.5;

                photoGroup.userData = {
                    id: index,
                    titulo: data.titulo,
                    texto: data.texto,
                    url: data.url
                };

                galaxyGroup.add(photoGroup);
                photoMeshes.push(imgMesh);
            });
        });

        // =========================================================================
        //  INTERACCIÓN CON RAYCASTER (CLIC EN IMÁGENES)
        // =========================================================================
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        function onPointerClick(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(photoMeshes);

            if (intersects.length > 0) {
                const parentGroup = intersects[0].object.parent;
                if (parentGroup && parentGroup.userData) {
                    openModal(parentGroup.userData);
                }
            }
        }

        window.addEventListener('click', onPointerClick);

        // Modal Handlers
        const modal = document.getElementById('imageModal');
        const modalImg = document.getElementById('modalImg');
        const modalTitle = document.getElementById('modalTitle');
        const modalText = document.getElementById('modalText');
        const closeModal = document.getElementById('closeModal');

        function openModal(data) {
            modalImg.src = data.url;
            modalTitle.innerText = data.titulo;
            modalText.innerText = data.texto;
            modal.classList.add('active');
        }

        closeModal.addEventListener('click', () => modal.classList.remove('active'));
        modal.addEventListener('click', (e) => {
            if (e.target === modal) modal.classList.remove('active');
        });

        // =========================================================================
        //  CICLO DE ANIMACIÓN CONTINUA
        // =========================================================================
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const time = clock.getElapsedTime();

            galaxyGroup.rotation.y = time * 0.04;
            

            animatedFlames.forEach(f => {
                const flicker = Math.sin(time * 14 + f.seed) * 0.08 + Math.cos(time * 22) * 0.04;
                f.mesh.scale.set(1 + flicker, 1 + flicker * 1.4, 1 + flicker);
                f.mesh.position.y = f.baseY + flicker * 0.04;
            });

            candleLight.intensity = 2.8 + Math.sin(time * 16) * 0.5;

            photoMeshes.forEach(mesh => {
                if (mesh.parent) {
                    mesh.parent.lookAt(camera.position);
                    mesh.parent.position.y += Math.sin(time * 1.8 + mesh.parent.userData.id) * 0.003;
                }
            });

            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        // =========================================================================
        //  RESIZE RESPONSIVO
        // =========================================================================
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
